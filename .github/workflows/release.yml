name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - run: |
          asset=cloud-tasks-emulator-x86_64-unknown-linux-gnu.tar.gz
          tar -czf "$asset" -C target/release cloud-tasks-emulator
          gh release create "$GITHUB_REF_NAME" --generate-notes "$asset"
        env:
          GH_TOKEN: ${{ github.token }}
