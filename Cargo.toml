[package]
name = "cloud-tasks-emulator"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14"
prost-types = "0.14"
rand = "0.10"
reqwest = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["io-util", "process"] }
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-native-roots"] }
