[package]
name = "cloud-tasks-emulator"
version = "0.1.0"
edition = "2024"
description = "Local emulator of the Google Cloud Tasks v2 API"
license = "MIT"
repository = "https://github.com/mwpryer/cloud-tasks-emulator"

[dependencies]
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.22"
jiff = { version = "0.2.38", default-features = false, features = ["std", "static"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
rand = "0.10"
reqwest = "0.13"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["io-util", "process"] }
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-native-roots"] }
